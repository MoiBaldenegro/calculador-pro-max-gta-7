<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculador Pro Max GTA 7</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f172a'/%3E%3Cpath d='M2 12 C5 12 6 4 8 4 C10 4 11 12 14 12' stroke='%2338bdf8' stroke-width='1.5' fill='none'/%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Calculador Pro Max GTA 7</h1>
    <p class="tagline">Calculadora científica y graficador de funciones · ángulos en radianes</p>
  </header>

  <main class="app-main">
    <section id="calculadora" class="panel" aria-labelledby="calc-title">
      <h2 id="calc-title">Calculadora</h2>
      <!-- La UI de la calculadora se monta aquí desde js/app.js -->
    </section>

    <section id="graficador" class="panel" aria-labelledby="graph-title">
      <h2 id="graph-title">Graficador</h2>
      <!-- F4/F5 montan aquí el canvas y los controles de zoom/paneo -->
    </section>
  </main>

  <footer class="app-footer">
    <p>100 % estático · sin backend · <span id="estado">cargando…</span></p>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
