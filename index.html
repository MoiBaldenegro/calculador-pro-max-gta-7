<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculador Pro Max GTA 7</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Calculador Pro Max GTA 7</h1>
    <p class="tagline">Calculadora científica y graficador de funciones · ángulos en radianes</p>
  </header>

  <main class="app-main">
    <section id="calculadora" class="panel" aria-labelledby="calc-title">
      <h2 id="calc-title">Calculadora</h2>
      <!-- F3 monta aquí el display, los botones y el historial -->
    </section>

    <section id="graficador" class="panel" aria-labelledby="graph-title">
      <h2 id="graph-title">Graficador</h2>
      <!-- F4/F5 montan aquí el canvas y los controles de zoom/paneo -->
    </section>
  </main>

  <footer class="app-footer">
    <p>100 % estático · sin backend · <span id="estado">cargando…</span></p>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
